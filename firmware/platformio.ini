; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags = 
	-DCORE_DEBUG_LEVEL=3
; Output is driven by Adafruit NeoPixel, not FastLED, for a hardware reason:
; the ESP32-C3 has only 2 RMT TX channels, and FastLED 3.10.3 holds one
; channel per controller for that controller's lifetime. Registering 8 strips
; fails with "no free tx channels" and then panics. (FastLED ships a
; README_WORKER_POOL.md describing transparent N>K channel sharing, but that
; implementation is not actually present in the source.)
; Adafruit NeoPixel shares ONE RMT channel across all instances, re-binding it
; per pin on every show, so 8 strips run fine on a 2-channel chip.
; FastLED is kept only for its colour/math helpers.
lib_deps =
	fastled/FastLED@^3.10.3
	adafruit/Adafruit NeoPixel@^1.15.5
