'start' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#22262c'>GPIO3   seg 1</text><line x1='740' y1='138' x2='806' y2='96' stroke='#e8a41f' stroke-width='1.1' marker-end='url(#ay)'/><rect x='808' y='114' width='150' height='24' rx='6' fill='#ffffff' stroke='#3a4048' stroke-width='1.2'/><text x='822' y='130' text-anchor='start' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#22262c'>GPIO4   seg 2</text><line x1='740' y1='138' x2='806' y2='126' stroke='#e8a41f' stroke-width='1.1' marker-end='url(#ay)'/><rect x='808' y='144' width='150' height='24' rx='6' fill='#ffffff' stroke='#3a4048' stroke-width='1.2'/><text x='822' y='160' text-anchor='start' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#22262c'>GPIO5   seg 3</text><line x1='740' y1='138' x2='806' y2='156' stroke='#e8a41f' stroke-width='1.1' marker-end='url(#ay)'/><rect x='808' y='174' width='150' height='24' rx='6' fill='#ffffff' stroke='#3a4048' stroke-width='1.2'/><text x='822' y='190' text-anchor='start' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#22262c'>GPIO6   seg 4</text><line x1='740' y1='138' x2='806' y2='186' stroke='#e8a41f' stroke-width='1.1' marker-end='url(#ay)'/><rect x='808' y='204' width='150' height='24' rx='6' fill='#ffffff' stroke='#3a4048' stroke-width='1.2'/><text x='822' y='220' text-anchor='start' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#22262c'>GPIO7   seg 5</text><line x1='740' y1='138' x2='806' y2='216' stroke='#e8a41f' stroke-width='1.1' marker-end='url(#ay)'/><rect x='808' y='234' width='150' height='24' rx='6' fill='#ffffff' stroke='#3a4048' stroke-width='1.2'/><text x='822' y='250' text-anchor='start' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#22262c'>GPIO21  seg 6</text><line x1='740' y1='138' x2='806' y2='246' stroke='#e8a41f' stroke-width='1.1' marker-end='url(#ay)'/><rect x='808' y='264' width='150' height='24' rx='6' fill='#ffffff' stroke='#3a4048' stroke-width='1.2'/><text x='822' y='280' text-anchor='start' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#22262c'>GPIO20  seg 7</text><line x1='740' y1='138' x2='806' y2='276' stroke='#e8a41f' stroke-width='1.1' marker-end='url(#ay)'/><rect x='808' y='294' width='150' height='24' rx='6' fill='#ffffff' stroke='#3a4048' stroke-width='1.2'/><text x='822' y='310' text-anchor='start' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='400' fill='#22262c'>GPIO8   seg 8</text><line x1='740' y1='138' x2='806' y2='306' stroke='#e8a41f' stroke-width='1.1' marker-end='url(#ay)'/><text x='40' y='336' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='13.5' font-weight='700' fill='#22262c'>Why not the obvious approaches</text><rect x='40' y='358' width='918' height='32' rx='6' fill='#f3f5f8' stroke='#3a4048' stroke-width='1'/><rect x='40' y='358' width='5' height='32' rx='2' fill='#c8403a'/><text x='58' y='379' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#22262c'>FastLED 3.10.3, 8 controllers</text><text x='330' y='379' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#6b7280'>one RMT channel held per controller  ->  "no free tx channels", then a panic</text><rect x='40' y='398' width='918' height='32' rx='6' fill='#f3f5f8' stroke='#3a4048' stroke-width='1'/><rect x='40' y='398' width='5' height='32' rx='2' fill='#b8860b'/><text x='58' y='419' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#22262c'>Adafruit NeoPixel, 8 instances</text><text x='330' y='419' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#6b7280'>works — re-binds one channel per pin per show — but measured 3 fps at 8 x 73</text><rect x='40' y='438' width='918' height='32' rx='6' fill='#f3f5f8' stroke='#3a4048' stroke-width='1'/><rect x='40' y='438' width='5' height='32' rx='2' fill='#3f9142'/><text x='58' y='459' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#22262c'>1 RMT channel + GPIO matrix fan-out</text><text x='330' y='459' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#6b7280'>63 fps, identical hardware-timed waveform on every segment</text><text x='40' y='488' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#22262c'>Trade-off: the eight segments are electrically the same signal, so they always show the same content — which is exactly what this piece wants.</text></svg>