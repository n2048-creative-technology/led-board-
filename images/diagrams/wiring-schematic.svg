='1.8'/><line x1='904' y1='466' x2='904' y2='482' stroke='#22262c' stroke-width='1.6'/><line x1='889' y1='482' x2='919' y2='482' stroke='#22262c' stroke-width='2.6'/><line x1='895' y1='489' x2='913' y2='489' stroke='#22262c' stroke-width='2.2'/><line x1='900' y1='496' x2='908' y2='496' stroke='#22262c' stroke-width='1.8'/><rect x='636' y='380' width='176' height='56' rx='8' fill='#f3f5f8' stroke='#3a4048' stroke-width='1.6'/><text x='724.0' y='406.0' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='600' fill='#22262c'>DC-DC buck</text><text x='724.0' y='424.0' text-anchor='middle' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11.5' fill='#6b7280'>24 V -> 5 V</text><line x1='724' y1='380' x2='724' y2='118' stroke='#c8403a' stroke-width='1.8'/><line x1='636' y1='408' x2='596' y2='408' stroke='#c8403a' stroke-width='1.8'/><path d='M 596 408 L 596 394 M 589 394 L 596 386 L 603 394 Z' fill='none' stroke='#c8403a' stroke-width='1.6' stroke-linejoin='round'/><text x='596' y='382' text-anchor='middle' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='11' font-weight='600' fill='#c8403a'>+5 V</text><text x='596' y='456' text-anchor='middle' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='10' font-weight='400' fill='#6b7280'>on J15-J18</text><line x1='724' y1='436' x2='724' y2='466' stroke='#22262c' stroke-width='1.8'/><line x1='724' y1='466' x2='724' y2='482' stroke='#22262c' stroke-width='1.6'/><line x1='709' y1='482' x2='739' y2='482' stroke='#22262c' stroke-width='2.6'/><line x1='715' y1='489' x2='733' y2='489' stroke='#22262c' stroke-width='2.2'/><line x1='720' y1='496' x2='728' y2='496' stroke='#22262c' stroke-width='1.8'/><path d='M 258 248 L 268 248 L 268 380 L 258 380' fill='none' stroke='#6b7280' stroke-width='1.2'/><line x1='268' y1='314' x2='268' y2='344' stroke='#6b7280' stroke-width='1.2'/><text x='276' y='348' text-anchor='start' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='10.5' font-weight='400' fill='#6b7280'>x 7 more</text><circle cx='48' cy='504' r='3' fill='#e8a41f'/><text x='62' y='508' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#22262c'>D2-D8 repeat this channel</text><text x='320' y='508' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#6b7280'>J3 buffers D1-D4, J4 buffers D5-D8; R1-R8 feed connectors J7-J14.</text><circle cx='48' cy='526' r='3' fill='#e8a41f'/><text x='62' y='530' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#22262c'>The buck is a module</text><text x='320' y='530' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#6b7280'>it mounts on the J15-J18 single-pin headers, so it can be sized to the load.</text><circle cx='48' cy='548' r='3' fill='#e8a41f'/><text x='62' y='552' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#22262c'>Only the data line is shifted</text><text x='320' y='552' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#6b7280'>the 24 V strip power never touches the board's logic side.</text><circle cx='48' cy='570' r='3' fill='#e8a41f'/><text x='62' y='574' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#22262c'>Every ground symbol is one node</text><text x='320' y='574' text-anchor='start' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#6b7280'>PSU, board and strips share it, or the data line has no reference.</text></svg>